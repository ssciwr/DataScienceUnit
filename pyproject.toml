[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-unit-site"
version = "0.1.0"
description = "MkDocs site for the Data Science Unit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]

[tool.setuptools]
py-modules = []
